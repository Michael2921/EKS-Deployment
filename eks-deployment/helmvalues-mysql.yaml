architecture: replication
replicaCount: 2
auth:
  database: mydb
  username: myuser
  existingSecret: mysql-creds
persistence:
  enabled: true
  storageClass: gp2
  size: 10Gi
global:
  security:
    allowInsecureImages: True
image: 
  registry: docker.io
  tag: latest
  repository: bitnamilegacy/mysql